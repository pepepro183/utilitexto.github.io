
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Busca y reemplaza palabras o frases en tus textos gratis con UtiliTexto.">
  <title>Buscar y reemplazar texto gratis | UtiliTexto</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f1f5f9;
      color: #172554;
    }

    header {
      background: #172554;
      color: white;
      text-align: center;
      padding: 28px 16px;
    }

    main {
      max-width: 850px;
      margin: 28px auto;
      padding: 0 16px;
    }

    .panel {
      background: white;
      padding: 22px;
      border-radius: 14px;
      box-shadow: 0 4px 16px #0001;
    }

    textarea,
    input[type="text"] {
      width: 100%;
      padding: 13px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font: inherit;
      margin-top: 6px;
    }

    textarea {
      min-height: 220px;
      resize: vertical;
    }

    .campo {
      margin: 18px 0;
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 6px;
    }

    .opcion {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 16px 0;
      font-weight: normal;
    }

    .buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin: 18px 0;
    }

    button {
      border: 0;
      border-radius: 8px;
      padding: 12px 16px;
      background: #1d4ed8;
      color: white;
      font-size: 14px;
      cursor: pointer;
    }

    button:hover {
      background: #1e40af;
    }

    .secondary {
      background: #475569;
    }

    .secondary:hover {
      background: #334155;
    }

    #status {
      min-height: 1.2em;
      color: #166534;
    }

    footer {
      text-align: center;
      padding: 24px;
      color: #475569;
    }
  </style>
</head>

<body>

<header>
  <h1>Buscar y reemplazar texto</h1>
  <p>Encuentra y sustituye palabras en segundos</p>
</header>

<main>
  <section class="panel">
    <h2>Introduce tu texto</h2>

    <div class="campo">
      <label for="texto">Texto original</label>
      <textarea id="texto" placeholder="Escribe o pega aquí tu texto..."></textarea>
    </div>

    <div class="campo">
      <label for="buscar">Texto que quieres buscar</label>
      <input
        type="text"
        id="buscar"
        placeholder="Palabra o frase que quieres encontrar"
      >
    </div>

    <div class="campo">
      <label for="reemplazar">Reemplazar por</label>
      <input
        type="text"
        id="reemplazar"
        placeholder="Escribe el nuevo texto"
      >
    </div>

    <label class="opcion">
      <input type="checkbox" id="sensible">
      Distinguir entre mayúsculas y minúsculas
    </label>

    <div class="buttons">
      <button type="button" onclick="reemplazarTexto()">
        Buscar y reemplazar
      </button>

      <button type="button" class="secondary" onclick="copiarTexto()">
        Copiar resultado
      </button>

      <button type="button" class="secondary" onclick="borrarTodo()">
        Borrar
      </button>
    </div>

    <p id="status" role="status" aria-live="polite"></p>
  </section>
</main>

<footer>
  UtiliTexto — Tus textos, más fáciles.
</footer>

<script>
function reemplazarTexto() {
  const texto = document.getElementById('texto');
  const buscar = document.getElementById('buscar').value;
  const reemplazo = document.getElementById('reemplazar').value;
  const sensible = document.getElementById('sensible').checked;
  const estado = document.getElementById('status');

  if (buscar.length === 0) {
    estado.textContent = 'Escribe el texto que quieres buscar.';
    document.getElementById('buscar').focus();
    return;
  }

  const original = texto.value;
  let resultado;
  let cantidad = 0;

  if (sensible) {
    const partes = original.split(buscar);
    cantidad = partes.length - 1;
    resultado = partes.join(reemplazo);
  } else {
    const escapado = buscar.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    const expresion = new RegExp(escapado, 'gi');
    resultado = original.replace(expresion, () => {
      cantidad++;
      return reemplazo;
    });
  }

  texto.value = resultado;

  estado.textContent = cantidad === 0
    ? 'No se encontraron coincidencias.'
    : 'Reemplazos realizados: ' + cantidad + '.';
}

async function copiarTexto() {
  const texto = document.getElementById('texto');
  const estado = document.getElementById('status');

  try {
    await navigator.clipboard.writeText(texto.value);
    estado.textContent = 'Texto copiado correctamente.';
  } catch (error) {
    texto.select();
    const correcto = document.execCommand('copy');

    estado.textContent = correcto
      ? 'Texto copiado correctamente.'
      : 'Selecciona el texto y cópialo manualmente.';
  }
}

function borrarTodo() {
  document.getElementById('texto').value = '';
  document.getElementById('buscar').value = '';
  document.getElementById('reemplazar').value = '';
  document.getElementById('sensible').checked = false;
  document.getElementById('status').textContent = 'Campos borrados.';
}
</script>

</body>
</html>
